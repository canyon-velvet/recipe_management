# Redis pub/sub, so a broadcast from another process (the Sidekiq worker, a console) reaches browsers
# connected to the web process. REDIS_URL defaults to the local Redis.
development:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/0") %>
  channel_prefix: recipe_management_development

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/0") %>
  channel_prefix: recipe_management_production
